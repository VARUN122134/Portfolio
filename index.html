<script>
// 3D Photo Scene in Hero
(function() {
  const c = document.getElementById('threejs-container');
  if (!c) return;
  const w = c.clientWidth || 500, h = c.clientHeight || 600;
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(75, w/h, .1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h); renderer.setPixelRatio(window.devicePixelRatio);
  c.appendChild(renderer.domElement);
  const geo = new THREE.PlaneGeometry(3.5, 4.5, 32, 32);
  const plane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: .2 }));
  scene.add(plane);

  function applyTexture(texture) {
    plane.material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 1 });
    plane.material.needsUpdate = true;
  }

  const imagePaths = ['./assets/profile.png', './assets/profile.jpg'];
  const loader = new THREE.TextureLoader();

  function loadNextImage(index) {
    if (index >= imagePaths.length) {
      plane.material = new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.5 });
      return;
    }

    loader.load(
      imagePaths[index],
      (tex) => applyTexture(tex),
      undefined,
      () => loadNextImage(index + 1)
    );
  }

  loadNextImage(0);

  scene.add(new THREE.AmbientLight(0xffffff, .6));
  const light = new THREE.PointLight(0x6366f1, 1); light.position.set(5,5,5); scene.add(light);
  camera.position.z = 5;
  let mx, my, tx = 0, ty = 0;
  document.addEventListener('mousemove', e => { mx = (e.clientX-window.innerWidth/2)/100; my = (e.clientY-window.innerHeight/2)/100; });
  function a() { requestAnimationFrame(a); tx += (mx-tx)*.05; ty += (my-ty)*.05; plane.rotation.y = tx*.2; plane.rotation.x = -ty*.2; renderer.render(scene,camera); }
  a();
  window.addEventListener('resize', () => {
    const nw = c.clientWidth || w, nh = c.clientHeight || h;
    camera.aspect = nw/nh; camera.updateProjectionMatrix(); renderer.setSize(nw, nh);
  });
})();
</script>
